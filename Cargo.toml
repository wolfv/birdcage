[package]
name = "birdcage"
version = "0.8.1"
description = "Cross-platform embeddable sandbox"
authors = ["Phylum, Inc. <engineering@phylum.io>"]
repository = "https://github.com/phylum-dev/birdcage"
documentation = "https://docs.rs/birdcage"
rust-version = "1.66.0"
license = "GPL-3.0-or-later"
edition = "2021"

[[test]]
name = "harness"
path = "integration/harness.rs"
harness = false

[[test]]
name = "command_io"
path = "integration/command_io.rs"
harness = false

[[test]]
name = "windows_sandbox_test"
path = "integration/windows_sandbox_test.rs"
harness = false

[[test]]
name = "windows_simple_test"
path = "integration/windows_simple_test.rs"
harness = false

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.132"
log = "0.4.20"
rustix = { version = "0.38.31", features = ["pipe", "stdio", "thread", "process", "fs"] }
seccompiler = "0.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_JobObjects",
    "System",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_System_IO",
] }

[dev-dependencies]
clap = { version = "3.2.17", features = ["derive"] }
serde_json = "1.0.108"
serde = { version = "1.0.193", features = ["derive"] }
tempfile = "3.3.0"

[dependencies]
bitflags = "2.4.0"
